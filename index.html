<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Timers</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <!-- Google Fonts for Digital Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Orbitron:wght@700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --accent: #2ecc71;
            /* Green */
            --warn: #ff4444;
            --pause-warn: #f1c40f;
            --text: #ffffff;
            --overtime: #ff6b6b;
            --btn-color: #f1c40f;
            /* Chrome Yellow */
            --font-digital: 'Orbitron', sans-serif;
            --font-ui: 'Chakra Petch', sans-serif;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background-color 0.5s;
        }

        /* Animations */
        @keyframes flashYellow {
            0% {
                background-color: var(--bg);
            }

            50% {
                background-color: #DBD844;
            }

            /* Requested Yellow */
            100% {
                background-color: var(--bg);
            }
        }

        @keyframes flashRed {
            0% {
                background-color: var(--bg);
            }

            50% {
                background-color: #D23175;
            }

            /* Requested Magenta */
            100% {
                background-color: var(--bg);
            }
        }

        .flash-paused {
            animation: flashYellow 2s infinite ease-in-out;
        }

        .flash-finished {
            animation: flashRed 2s infinite ease-in-out;
        }

        /* Header / Warnings */
        .top-bar {
            background: #111;
            padding: 15px;
            font-size: 1.25rem;
            color: var(--accent);
            text-align: center;
            font-weight: bold;
            border-bottom: 2px solid #333;
            letter-spacing: 1px;
            font-family: var(--font-digital);
            flex-shrink: 0;
        }

        .command-help {
            text-align: center;
            padding: 10px 0 15px 0;
            font-size: 1.1rem;
            color: #ccc;
        }

        .command-highlight {
            color: var(--accent);
            white-space: nowrap;
            font-weight: bold;
        }

        /* Folder Tabs */
        .tab-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 10px 10px 0;
            background: #111;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
        }

        .tab {
            padding: 12px 20px;
            background: #333;
            border-radius: 8px 8px 0 0;
            white-space: nowrap;
            font-size: 1rem;
            color: #888;
            transition: 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
            font-weight: bold;
        }

        /* Main Display */
        .main-timer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Circular Progress */
        .progress-container {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring__circle {
            stroke: var(--accent);
            stroke-width: 22;
            fill: transparent;
            stroke-dasharray: 816;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
            stroke-linecap: round;
        }

        .progress-ring__bg {
            stroke: #333;
            stroke-width: 22;
            fill: transparent;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-family: var(--font-digital);
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .overtime-text {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 1.8rem;
            color: var(--overtime);
            font-weight: bold;
            font-family: var(--font-digital);
            display: none;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .status-pill {
            background: #444;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #taskName {
            margin-top: 20px;
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
        }

        /* Control Panel */
        .controls {
            background: var(--card);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            flex-shrink: 0;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--btn-color);
            color: #000;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: 0.2s;
            font-family: var(--font-ui);
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .next-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .interval-list {
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3d3d3d;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 8px;
        }

        .item.active {
            border: 1px solid var(--accent);
            background: #334;
        }

        input[type="text"],
        input[type="number"] {
            background: transparent;
            border: none;
            color: white;
            border-bottom: 1px solid #555;
            font-family: inherit;
            font-size: 1rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-family: var(--font-ui);
        }

        .icon-btn {
            background: transparent;
            color: #888;
            font-size: 1.2rem;
            padding: 0 5px;
        }

        .icon-btn:hover {
            color: #fff;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
            position: relative;
            border: 1px solid #555;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff4444;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <div>Voice Controlled Timers</div>
        <div
            style="font-size: 0.9rem; color: #f1c40f; margin-top: 8px; font-family: var(--font-ui); letter-spacing: 0;">
            WORKS BEST IN GOOGLE CHROME • LEAVE BROWSER OPEN</div>
    </div>

    <div class="tab-bar" id="tabBar"></div>

    <div class="main-timer">
        <div id="statusPill" class="status-pill">Ready</div>
        <div class="progress-container">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring__bg" cx="150" cy="150" r="130"></circle>
                <circle id="progressCircle" class="progress-ring__circle" cx="150" cy="150" r="130"></circle>
            </svg>
            <div class="timer-text" id="timeDisplay">00:00</div>
            <div id="overtimeDisplay" class="overtime-text"></div>
        </div>
        <div id="taskName">Tap Start</div>
    </div>

    <div class="controls">
        <div class="command-help">
            Say:
            <span class="command-highlight">"[Name] Start"</span> •
            <span class="command-highlight">"[Name] Pause"</span> •
            <span class="command-highlight">"[Name] Resume"</span> •
            <span class="command-highlight">"[Name] Next"</span>
        </div>
        <div class="next-wrapper">
            <button class="btn-main" id="startBtn" onclick="toggleActiveSession()">START SESSION</button>
            <div class="checkbox-wrapper" onclick="toggleVoice()" title="Enable Voice Commands">
                <input type="checkbox" id="voiceToggle">
                <span>Mic</span>
            </div>
        </div>

        <div class="interval-list" id="intervalList"></div>
        <div style="display:flex; gap:10px;">
            <button onclick="addInterval()" style="flex:1; padding:12px; background:#444; color:white;">+ Add
                Task</button>
            <button onclick="addTab()" style="flex:1; padding:12px; background:#444; color:white;">+ New Folder</button>
        </div>
    </div>

    <!-- Simple Mic Perm Modal -->
    <div id="micModal" class="modal-overlay">
        <div class="modal">
            <div class="close-modal" onclick="closeModal()">✕</div>
            <h3>Enable Audio?</h3>
            <p>This app uses voice commands and text-to-speech.</p>
            <button onclick="enableMic()"
                style="background:var(--accent); color:black; padding:10px 20px; font-weight:bold; margin-top:10px; border-radius:5px;">Enable</button>
        </div>
    </div>

    <script>
        // --- State Management ---
        // Stored Config (Persistent)
        let sessionConfig = JSON.parse(localStorage.getItem('timer_config_v4')) || [
            { id: 'def', title: "Workout", intervals: [{ title: "Warmup", mins: 5 }, { title: "Work", mins: 15 }] }
        ];

        // Runtime State (Volatile - resets on reload)
        let runtimeState = {};
        let activeTabId = sessionConfig[0].id;

        // --- Globals ---
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let mainLoopId = null;
        let voiceEnabled = false;

        // UI Refs
        const circle = document.getElementById('progressCircle');
        const radius = circle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;

        // --- Init ---
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.onresult = handleVoiceResult;
            recognition.onend = () => {
                if (voiceEnabled && recognition) {
                    try { recognition.start(); } catch (e) { }
                }
            };
            recognition.onerror = (e) => {
                console.log("Recognition error:", e.error);
            };
        }

        // Initialize Runtime State for all configs
        sessionConfig.forEach(s => resetRuntime(s.id));

        // Check for mic first time
        if (!localStorage.getItem('mic_seen_v2')) {
            document.getElementById('micModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('micModal').style.display = 'none';
            localStorage.setItem('mic_seen_v2', 'true');
        }

        function enableMic() {
            closeModal();
            sessionStorage.setItem('mic_granted', 'true');
            if (recognition) {
                try { recognition.start(); setTimeout(() => recognition.stop(), 500); } catch (e) { }
            }
            document.getElementById('voiceToggle').checked = true;
            voiceEnabled = true;
        }

        function resetRuntime(id) {
            runtimeState[id] = {
                state: 'IDLE',
                startTime: 0,
                pausedAt: 0,
                duration: 0,
                currentIdx: 0,
                overtimeStart: 0
            };
        }

        // --- Core Loop ---
        function startMainLoop() {
            if (!mainLoopId) mainLoopId = setInterval(tick, 100);
        }

        function tick() {
            const now = Date.now();

            sessionConfig.forEach(config => {
                const run = runtimeState[config.id];
                if (!run) return;

                // Handle Logic
                if (run.state === 'RUNNING') {
                    const elapsed = now - run.startTime;
                    if (elapsed >= run.duration) {
                        finishInterval(config.id);
                    }
                }
            });

            // UI Update: ALWAYS update the ACTIVE tab, regardless of its state
            const activeRun = runtimeState[activeTabId];
            const activeConf = sessionConfig.find(s => s.id === activeTabId);
            if (activeRun && activeConf) {
                updateActiveUI(activeRun, activeConf);
            }
        }

        function updateActiveUI(run, config) {
            // If config has no intervals, clear UI
            const currentTask = config.intervals[run.currentIdx];

            if (!currentTask) {
                document.getElementById('timeDisplay').innerText = "00:00";
                document.getElementById('taskName').innerText = "No Tasks";
                document.getElementById('statusPill').innerText = "Empty";
                circle.style.strokeDashoffset = circumference;
                document.getElementById('overtimeDisplay').style.display = 'none';
                document.getElementById('startBtn').innerText = "START SESSION";
                document.getElementById('startBtn').style.background = "var(--btn-color)";
                document.body.className = '';
                return;
            }

            let remaining = 0;
            let ovt = 0;

            if (run.state === 'IDLE') {
                remaining = currentTask.mins * 60;
                document.body.className = '';
            } else if (run.state === 'RUNNING') {
                const elapsed = Date.now() - run.startTime;
                remaining = Math.max(0, (run.duration - elapsed) / 1000);
                document.body.className = '';
            } else if (run.state === 'PAUSED') {
                const elapsed = run.pausedAt - run.startTime;
                remaining = Math.max(0, (run.duration - elapsed) / 1000);
                ovt = (Date.now() - run.overtimeStart) / 1000;
                document.body.className = 'flash-paused';
            } else if (run.state === 'FINISHED') {
                remaining = 0;
                ovt = (Date.now() - run.overtimeStart) / 1000;
                document.body.className = 'flash-finished';
            }

            // Timer Text
            const m = Math.floor(remaining / 60);
            const s = Math.floor(remaining % 60);
            document.getElementById('timeDisplay').innerText = `${m}:${s < 10 ? '0' + s : s}`;

            // Ring
            const totalSec = currentTask.mins * 60;
            const percent = totalSec > 0 ? (remaining / totalSec) * 100 : 0;
            const offset = circumference - (percent / 100 * circumference);
            circle.style.strokeDashoffset = offset;

            // Color Logic (Red < 10%)
            if (percent < 10 && run.state === 'RUNNING') {
                circle.style.stroke = 'var(--warn)';
            } else {
                circle.style.stroke = 'var(--accent)';
            }

            // Overtime Display
            const ovDisplay = document.getElementById('overtimeDisplay');
            if ((run.state === 'FINISHED' || run.state === 'PAUSED') && ovt > 0) {
                ovDisplay.style.display = 'block';
                const om = Math.floor(ovt / 60);
                const os = Math.floor(ovt % 60);
                ovDisplay.innerText = `+${om < 10 ? '0' + om : om}:${os < 10 ? '0' + os : os}`;
            } else {
                ovDisplay.style.display = 'none';
            }

            // Status / Btn Text
            const btn = document.getElementById('startBtn');
            const pill = document.getElementById('statusPill');
            const taskName = document.getElementById('taskName');
            const tabName = config.title.toUpperCase();

            taskName.innerText = currentTask.title;

            if (run.state === 'RUNNING') {
                btn.innerText = `PAUSE`;
                btn.style.background = "#f39c12"; // Softer Orange
                pill.innerText = "Running";
            } else if (run.state === 'PAUSED') {
                btn.innerText = `${tabName} RESUME`;
                btn.style.background = "var(--btn-color)";
                pill.innerText = "Paused (Counting Up)";
            } else if (run.state === 'FINISHED') {
                btn.innerText = `${tabName} NEXT`;
                btn.style.background = "var(--btn-color)";
                pill.innerText = "Done. Waiting for Next...";
            } else {
                btn.innerText = `${tabName} START`;
                btn.style.background = "var(--btn-color)";
                pill.innerText = "Ready";
            }
        }

        // --- Actions ---

        function toggleActiveSession() {
            const run = getActiveRuntime();
            const config = getActiveConfig();
            if (!run || !config) return;

            if (run.state === 'IDLE') startSession(config.id);
            else if (run.state === 'RUNNING') pauseSession(config.id);
            else if (run.state === 'PAUSED') resumeSession(config.id);
            else if (run.state === 'FINISHED') nextInterval(config.id);
        }

        function startSession(id) {
            const run = runtimeState[id];
            const config = sessionConfig.find(s => s.id === id);
            if (!config || !config.intervals.length) return;

            run.duration = config.intervals[run.currentIdx].mins * 60 * 1000;
            run.startTime = Date.now();
            run.state = 'RUNNING';

            if (voiceEnabled && recognition) { try { recognition.start(); } catch (e) { } }
        }

        function resumeSession(id) {
            const run = runtimeState[id];
            if (run.state !== 'PAUSED') return;

            const pauseDuration = Date.now() - run.pausedAt;
            run.startTime += pauseDuration;
            run.state = 'RUNNING';
        }

        function pauseSession(id) {
            const run = runtimeState[id];
            if (run.state !== 'RUNNING') return;

            run.state = 'PAUSED';
            run.pausedAt = Date.now();
            run.overtimeStart = Date.now();
        }

        function nextInterval(id) {
            const run = runtimeState[id];
            const config = sessionConfig.find(s => s.id === id);
            if (!run || !config) return;

            run.currentIdx++;
            if (run.currentIdx >= config.intervals.length) {
                run.state = 'IDLE';
                run.currentIdx = 0;
                const msg = new SpeechSynthesisUtterance(`${config.title} Complete`);
                synth.speak(msg);
            } else {
                run.state = 'IDLE';
                startSession(id);
            }
        }

        function finishInterval(id) {
            const run = runtimeState[id];
            const config = sessionConfig.find(s => s.id === id);

            if (run.state !== 'FINISHED') {
                run.state = 'FINISHED';
                run.overtimeStart = Date.now();

                const title = config.intervals[run.currentIdx].title;
                const msg = new SpeechSynthesisUtterance(`${config.title} ${title} End`);
                synth.speak(msg);
            }
        }

        function handleVoiceResult(e) {
            const transcript = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
            console.log("Voice:", transcript);

            let targetedConfig = null;
            const sortedConfigs = [...sessionConfig].sort((a, b) => b.title.length - a.title.length);

            for (let config of sortedConfigs) {
                if (transcript.includes(config.title.toLowerCase())) {
                    targetedConfig = config;
                    break;
                }
            }

            const targetId = targetedConfig ? targetedConfig.id : activeTabId;
            const run = runtimeState[targetId];
            if (!run) return;

            if (transcript.includes('next')) {
                if (run.state === 'FINISHED') nextInterval(targetId);
            }
            else if (transcript.includes('pause')) {
                if (run.state === 'RUNNING') pauseSession(targetId);
            }
            else if (transcript.includes('resume')) {
                if (run.state === 'PAUSED') resumeSession(targetId);
            }
            else if (transcript.includes('start')) {
                if (run.state === 'IDLE') startSession(targetId);
                if (run.state === 'PAUSED') resumeSession(targetId);
            }
        }

        function toggleVoice() {
            voiceEnabled = document.getElementById('voiceToggle').checked;
            if (voiceEnabled && recognition) try { recognition.start(); } catch (e) { }
            if (!voiceEnabled && recognition) try { recognition.stop(); } catch (e) { }
        }

        // --- Data / Rendering ---

        function getActiveConfig() { return sessionConfig.find(s => s.id === activeTabId); }
        function getActiveRuntime() { return runtimeState[activeTabId]; }

        function renderTabs() {
            const bar = document.getElementById('tabBar');
            bar.innerHTML = '';
            sessionConfig.forEach(s => {
                const t = document.createElement('div');
                t.className = `tab ${s.id === activeTabId ? 'active' : ''}`;
                t.innerText = s.title;
                t.onclick = () => { activeTabId = s.id; render(); };
                t.ondblclick = () => {
                    const newName = prompt("Rename Folder:", s.title);
                    if (newName) { s.title = newName; save(); renderTabs(); }
                };
                t.oncontextmenu = (e) => {
                    e.preventDefault();
                    if (confirm(`Delete '${s.title}'?`)) {
                        sessionConfig = sessionConfig.filter(x => x.id !== s.id);
                        if (sessionConfig.length === 0) addTab();
                        activeTabId = sessionConfig[0].id;
                        save();
                        render();
                    }
                };
                bar.appendChild(t);
            });
        }

        function renderList() {
            const list = document.getElementById('intervalList');
            list.innerHTML = '';
            const config = getActiveConfig();
            const run = getActiveRuntime();

            if (!config) return;

            config.intervals.forEach((int, i) => {
                const div = document.createElement('div');
                const isCurrent = (i === run.currentIdx);
                div.className = `item ${isCurrent ? 'active' : ''}`;
                div.innerHTML = `
                <div style="flex:1">
                    <input type="text" value="${int.title}" onchange="updateInt(${i}, 'title', this.value)" style="width:70%; font-weight:bold;">
                </div>
                <div style="display:flex; align-items:center; gap:5px;">
                    <input type="number" value="${int.mins}" onchange="updateInt(${i}, 'mins', this.value)" style="width:40px; text-align:right;">
                    <span style="font-size:0.8rem; color:#888;">min</span>
                    <button class="icon-btn" onclick="removeInt(${i})">×</button>
                </div>
            `;
                list.appendChild(div);
            });
        }

        function updateInt(i, f, v) {
            const config = getActiveConfig();
            config.intervals[i][f] = f === 'mins' ? parseInt(v) : v;
            save();
        }
        function removeInt(i) {
            const config = getActiveConfig();
            config.intervals.splice(i, 1);
            save();
            renderList();
        }
        function addInterval() {
            getActiveConfig().intervals.push({ title: 'Work', mins: 1 });
            save();
            renderList();
        }
        function addTab() {
            const id = 's_' + Date.now();
            sessionConfig.push({ id: id, title: 'New Folder', intervals: [] });
            resetRuntime(id);
            activeTabId = id;
            save();
            render();
        }

        function save() { localStorage.setItem('timer_config_v4', JSON.stringify(sessionConfig)); }
        function render() { renderTabs(); renderList(); }

        if (sessionConfig.length === 0) addTab();
        else {
            if (!sessionConfig.find(s => s.id === activeTabId)) activeTabId = sessionConfig[0].id;
            render();
        }
        startMainLoop();

    </script>
</body>

</html>
